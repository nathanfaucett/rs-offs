[package]
name = "iroh-chain"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "iroh network layer for chains of keys"

[lib]
name = "iroh_chain"

[features]
default = ["in-memory"]
in-memory = []
utoipa = ["dep:utoipa"]
axum = ["dep:axum"]
wasm = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dependencies]
# Iroh
iroh = { version = "1.1",  default-features = false, features = [] }
iroh-tickets = { version = "1.0",  default-features = false, features = [] }

# Web
utoipa = { version = "5.5", default-features = false, features = [
  "macros",
  "chrono",
], optional = true }
axum = { version = "0.8", default-features = false, features = [
  "json",
], optional = true }

# Serialization
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }

# Utilities
blake3 = { version = "1.8", default-features = false, features = [] }
chrono = { version = "0.4", default-features = false, features = [
    "std",
  "serde",
  "alloc",
] }
tracing = { version = "0.1", default-features = false, features = [] }
dashmap = { version = "6.2", default-features = false, features = [] }

# Async
futures = { version = "0.3", default-features = false, features = [] }
tokio = { version = "1.53", default-features = false, features = [
  "io-util",
  "macros",
  "rt",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", default-features = false, features = [] }
noq = { version = "1.2", default-features = false, features = [] }

# Optional TS generation + serde for tsify
tsify = { version = "0.5", default-features = false, features = [
  "js",
], optional = true }
serde-wasm-bindgen = { version = "0.6", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", default-features = false, features = [
  "std",
], optional = true }

[dev-dependencies]
iroh = { version = "1.1",  default-features = true }

log = "0.4"
env_logger = "0.11"
test-log = "0.2"
