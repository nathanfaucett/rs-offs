[package]
name = "file-system"
version = "0.1.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Local-first, eventually consistent file system primitives"

[lib]
name = "file_system"

[features]
default = []
iroh = ["dep:iroh", "tokio/io-util", "tokio/rt"]

[dependencies]
# Internal
btree-redb = { path = "../../../ofdb/crates/btree-redb", default-features = false }
kv = { path = "../../../ofdb/crates/kv", default-features = false }
kv-sync = { path = "../../../ofdb/crates/kv-sync", default-features = false }

# Async
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1.52", default-features = false, features = ["macros", "sync", "time"] }

# Iroh
iroh = { version = "1.1", default-features = false, features = ["tls-ring"], optional = true }

# Serialization
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }

# Storage
redb = { version = "4.3", default-features = false, features = ["std"] }

# Utilities
bytes = { version = "1.11", default-features = false, features = ["serde", "std"] }
uuid = { version = "1.26", default-features = false, features = ["serde", "std", "v7"] }

[dev-dependencies]
# Async
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1.52", default-features = false, features = ["macros", "rt", "time"] }
