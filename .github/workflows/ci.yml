name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with rustfmt + clippy)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get install protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        run: cargo install just --locked

      - name: Rust fmt check
        run: just fmt-check

      - name: Cargo clippy
        run: just clippy

      - name: Check metadata and remote dependency isolation
        run: |
          cargo metadata --no-deps --format-version 1 > /dev/null
          if cargo tree -p ofdb-sql --no-default-features --features remote --edges normal | grep -E 'ofdb-(sql-engine|btree|sql-sync)|redb v|automerge v'; then
            echo "SQL remote feature includes embedded or sync dependencies" >&2
            exit 1
          fi
          if cargo tree -p ofdb-kv --no-default-features --features remote --edges normal | grep -E 'ofdb-(btree|kv-store|kv-sync)|redb v|automerge v'; then
            echo "KV remote feature includes embedded or sync dependencies" >&2
            exit 1
          fi

  cargo-tests:
    name: Cargo tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: sudo apt-get install protobuf-compiler

      - name: Install just
        run: cargo install just --locked

      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Install crap
        run: cargo install cargo-crap --version 0.5.0 --locked

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      - name: Show rustc/cargo
        run: rustc --version && cargo --version

      - name: Crap coverage
        run: just crap-summary

      - name: Test
        run: just test
